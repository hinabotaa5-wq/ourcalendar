name = "ourcalendar-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "ourcalendar"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"

[triggers]
crons = ["0 * * * *"]

[vars]
APP_ORIGIN = "https://ourcalendar.pages.dev"

# Secrets (never commit values — set via `wrangler secret put`):
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, SETUP_SECRET
